services:
  postgres:
    image: postgres:16
    container_name: wma-postgres
    environment:
      POSTGRES_USER: wma
      POSTGRES_PASSWORD: wma
      POSTGRES_DB: wma
    ports:
      - '5432:5432'
    volumes:
      - wma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wma -d wma']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  wma-pgdata:
