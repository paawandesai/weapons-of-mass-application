<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to your candidate account</title>
  </head>
  <body>
    <div class="ashby-auth">
      <h1>Sign in</h1>
      <form class="ashby-auth-form" data-mode="sign-in">
        <label for="auth-email">Email address</label>
        <input type="email" id="auth-email" name="email" required />
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" name="password" required />
        <button type="submit" class="ashby-auth-submit">Sign in</button>
        <button type="button" class="ashby-auth-switch" onclick="location.href = 'account.html'">
          Create an account
        </button>
        <p class="ashby-auth-error" role="alert" hidden></p>
      </form>
    </div>
    <script>
      document.querySelector('.ashby-auth-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        if (
          f.email.value === 'candidate@example.com' &&
          f.password.value === 'correct-horse-battery'
        ) {
          location.href = 'form.html';
        } else {
          var err = f.querySelector('.ashby-auth-error');
          err.textContent = 'We could not sign you in with those details.';
          err.hidden = false;
        }
      });
    </script>
  </body>
</html>
