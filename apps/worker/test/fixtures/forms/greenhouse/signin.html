<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in to apply</title>
  </head>
  <body>
    <div id="account_wall">
      <h1>Sign in</h1>
      <form id="account_form" data-mode="sign-in">
        <label for="account_email">Email</label>
        <input type="email" id="account_email" name="email" required />
        <label for="account_password">Password</label>
        <input type="password" id="account_password" name="password" required />
        <button type="submit" id="sign_in">Sign in</button>
        <p class="switch">
          New here? <a href="account.html" id="show_signup">Create an account</a>
        </p>
        <p class="error" role="alert" hidden></p>
      </form>
    </div>
    <script>
      document.getElementById('account_form').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        if (
          f.email.value === 'candidate@example.com' &&
          f.password.value === 'correct-horse-battery'
        ) {
          location.href = 'form.html';
        } else {
          var err = f.querySelector('.error');
          err.textContent = 'Invalid email or password.';
          err.hidden = false;
        }
      });
    </script>
  </body>
</html>
