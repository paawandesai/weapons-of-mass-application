<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Senior Platform Engineer at Acme Robotics</title>
  </head>
  <body>
    <div id="app_body">
      <h1 class="app-title">Senior Platform Engineer</h1>
      <div class="company-name">Acme Robotics</div>
      <form id="application_form" data-confirm="confirmation.html">
        <div id="main_fields">
          <div class="field">
            <label class="field-label" for="first_name"
              >First Name <span class="asterisk">*</span></label
            >
            <input type="text" id="first_name" name="job_application[first_name]" required />
          </div>
          <div class="field">
            <label class="field-label" for="last_name"
              >Last Name <span class="asterisk">*</span></label
            >
            <input type="text" id="last_name" name="job_application[last_name]" required />
          </div>
          <div class="field">
            <label class="field-label" for="email">Email <span class="asterisk">*</span></label>
            <input type="email" id="email" name="job_application[email]" required />
          </div>
          <div class="field">
            <label class="field-label" for="phone">Phone</label>
            <input type="tel" id="phone" name="job_application[phone]" />
          </div>
          <div class="field" id="resume_fieldset">
            <label class="field-label" for="resume"
              >Resume/CV <span class="asterisk">*</span></label
            >
            <input type="file" id="resume" name="job_application[resume]" required />
          </div>
          <div class="field">
            <label class="field-label" for="cover_letter">Cover Letter</label>
            <input type="file" id="cover_letter" name="job_application[cover_letter]" />
          </div>
        </div>

        <div id="custom_fields">
          <div class="field">
            <label class="field-label" for="job_application_answers_attributes_0_text_value"
              >LinkedIn Profile</label
            >
            <input
              type="text"
              id="job_application_answers_attributes_0_text_value"
              name="job_application[answers_attributes][0][text_value]"
            />
          </div>
          <div class="field">
            <label class="field-label" for="job_application_answers_attributes_1_text_value"
              >Why do you want to work at Acme Robotics? <span class="asterisk">*</span></label
            >
            <textarea
              id="job_application_answers_attributes_1_text_value"
              name="job_application[answers_attributes][1][text_value]"
              maxlength="1500"
              required
            ></textarea>
          </div>
          <div class="field">
            <label class="field-label" for="auth"
              >Are you legally authorized to work in the United States?
              <span class="asterisk">*</span></label
            >
            <select id="auth" name="job_application[answers_attributes][2][boolean_value]" required>
              <option value="">Please select</option>
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>
          <fieldset class="field">
            <legend class="field-label">
              Will you now or in the future require visa sponsorship?
              <span class="asterisk">*</span>
            </legend>
            <label class="option"
              ><input type="radio" name="sponsorship" value="yes" required /> Yes</label
            >
            <label class="option"><input type="radio" name="sponsorship" value="no" /> No</label>
          </fieldset>
          <div class="field">
            <label class="field-label" for="privacy">
              <input type="checkbox" id="privacy" name="privacy" required /> I acknowledge the
              privacy policy <span class="asterisk">*</span>
            </label>
          </div>
        </div>

        <div data-variant="unmapped">
          <div class="field">
            <label class="field-label" for="portfolio_zip"
              >Portfolio archive (.zip) <span class="asterisk">*</span></label
            >
            <input
              type="file"
              id="portfolio_zip"
              name="job_application[answers_attributes][9][attachment]"
              required
            />
          </div>
        </div>

        <div id="eeoc_fields">
          <h3>Voluntary Self-Identification</h3>
          <p>
            Acme Robotics is an equal opportunity employer. Completing this section is voluntary.
          </p>
          <div class="field">
            <label class="field-label" for="job_application_gender">Gender</label>
            <select id="job_application_gender" name="job_application[gender]">
              <option value="">Please select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Decline To Self Identify</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="job_application_hispanic_ethnicity"
              >Are you Hispanic/Latino?</label
            >
            <select
              id="job_application_hispanic_ethnicity"
              name="job_application[hispanic_ethnicity]"
            >
              <option value="">Please select</option>
              <option>Yes</option>
              <option>No</option>
              <option>Decline To Self Identify</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="job_application_race">Race</label>
            <select id="job_application_race" name="job_application[race]">
              <option value="">Please select</option>
              <option>Asian</option>
              <option>White</option>
              <option>Decline To Self Identify</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="job_application_veteran_status">Veteran Status</label>
            <select id="job_application_veteran_status" name="job_application[veteran_status]">
              <option value="">Please select</option>
              <option>I am not a protected veteran</option>
              <option>Decline To Self Identify</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="job_application_disability_status"
              >Disability Status</label
            >
            <select
              id="job_application_disability_status"
              name="job_application[disability_status]"
            >
              <option value="">Please select</option>
              <option>Yes, I have a disability</option>
              <option>No, I do not have a disability</option>
              <option>Decline To Self Identify</option>
            </select>
          </div>
        </div>

        <div id="captcha-widget" class="captcha-widget" data-variant="captcha" hidden>
          <p>Type the characters you see to continue.</p>
          <img class="captcha-img" alt="Security check" width="160" height="56" />
          <input type="text" id="captcha-answer" name="captcha" autocomplete="off" />
          <button type="button" data-captcha-verify>Verify</button>
          <p class="captcha-error" hidden>That was not right. Try again.</p>
        </div>

        <button type="submit" id="submit_app" class="btn">Submit Application</button>
      </form>
    </div>
    <script src="../_shared/fixture.js"></script>
  </body>
</html>
