<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Robotics - Senior Platform Engineer</title>
  </head>
  <body>
    <div class="content-wrapper application-page">
      <div class="posting-header"><h2>Senior Platform Engineer</h2></div>
      <form id="application-form" class="application-form" data-confirm="thanks.html">
        <div class="application-section" id="personal-information">
          <h4>Submit your application</h4>
          <ul>
            <li class="application-question resume">
              <label>
                <div class="application-label">
                  Resume/CV <span class="required">&#10033;</span>
                </div>
                <div class="application-field">
                  <input type="file" name="resume" id="resume-upload-input" required />
                </div>
              </label>
            </li>
            <li class="application-question name">
              <label>
                <div class="application-label">
                  Full name <span class="required">&#10033;</span>
                </div>
                <div class="application-field"><input type="text" name="name" required /></div>
              </label>
            </li>
            <li class="application-question email">
              <label>
                <div class="application-label">Email <span class="required">&#10033;</span></div>
                <div class="application-field"><input type="email" name="email" required /></div>
              </label>
            </li>
            <li class="application-question phone">
              <label>
                <div class="application-label">Phone</div>
                <div class="application-field"><input type="tel" name="phone" /></div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Current company</div>
                <div class="application-field"><input type="text" name="org" /></div>
              </label>
            </li>
          </ul>
        </div>

        <div class="application-section" id="links">
          <h4>Links</h4>
          <ul>
            <li class="application-question">
              <label>
                <div class="application-label">LinkedIn URL</div>
                <div class="application-field"><input type="text" name="urls[LinkedIn]" /></div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">GitHub URL</div>
                <div class="application-field"><input type="text" name="urls[GitHub]" /></div>
              </label>
            </li>
          </ul>
        </div>

        <div class="application-section" id="custom-questions">
          <h4>Additional questions</h4>
          <ul>
            <li class="application-question custom-question">
              <label>
                <div class="application-label">
                  Tell us about a system you scaled and what you learned.
                  <span class="required">&#10033;</span>
                </div>
                <div class="application-field">
                  <textarea name="cards[a1b2c3][field0]" maxlength="2000" required></textarea>
                </div>
              </label>
            </li>
            <li class="application-question custom-question">
              <label>
                <div class="application-label">
                  Are you authorized to work in the country where this role is based?
                  <span class="required">&#10033;</span>
                </div>
                <div class="application-field">
                  <select name="cards[a1b2c3][field1]" required>
                    <option value="">Select...</option>
                    <option>Yes</option>
                    <option>No</option>
                  </select>
                </div>
              </label>
            </li>
            <li class="application-question custom-question">
              <div class="application-label">
                Are you open to relocation? <span class="required">&#10033;</span>
              </div>
              <div class="application-field">
                <ul>
                  <li>
                    <label class="option"
                      ><input type="radio" name="cards[a1b2c3][field2]" value="Yes" required />
                      <span>Yes</span></label
                    >
                  </li>
                  <li>
                    <label class="option"
                      ><input type="radio" name="cards[a1b2c3][field2]" value="No" />
                      <span>No</span></label
                    >
                  </li>
                </ul>
              </div>
            </li>
            <li class="application-question custom-question">
              <label>
                <div class="application-label">Additional information</div>
                <div class="application-field">
                  <textarea name="comments" maxlength="500"></textarea>
                </div>
              </label>
            </li>
            <li class="application-question custom-question" data-variant="unmapped">
              <label>
                <div class="application-label">
                  Upload your portfolio archive <span class="required">&#10033;</span>
                </div>
                <div class="application-field">
                  <input type="file" name="cards[a1b2c3][field9]" required />
                </div>
              </label>
            </li>
          </ul>
        </div>

        <div class="application-section application-eeo" id="eeo">
          <h4>U.S. Equal Employment Opportunity information (optional)</h4>
          <p>Providing this information is voluntary.</p>
          <ul>
            <li class="application-question">
              <label>
                <div class="application-label">Gender</div>
                <div class="application-field">
                  <select name="eeo[gender]">
                    <option value="">Select...</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Decline to self-identify</option>
                  </select>
                </div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Race</div>
                <div class="application-field">
                  <select name="eeo[race]">
                    <option value="">Select...</option>
                    <option>Asian</option>
                    <option>White</option>
                    <option>Decline to self-identify</option>
                  </select>
                </div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Veteran status</div>
                <div class="application-field">
                  <select name="eeo[veteran]">
                    <option value="">Select...</option>
                    <option>I am not a protected veteran</option>
                    <option>Decline to self-identify</option>
                  </select>
                </div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Disability status</div>
                <div class="application-field">
                  <select name="eeo[disability]">
                    <option value="">Select...</option>
                    <option>Yes</option>
                    <option>No</option>
                    <option>Decline to self-identify</option>
                  </select>
                </div>
              </label>
            </li>
          </ul>
        </div>

        <div id="captcha-widget" class="captcha-widget" data-variant="captcha" hidden>
          <p>Please confirm you are human.</p>
          <img class="captcha-img" alt="Security check" width="160" height="56" />
          <input type="text" name="captcha" autocomplete="off" />
          <button type="button" data-captcha-verify>Verify</button>
          <p class="captcha-error" hidden>Incorrect. Please try again.</p>
        </div>

        <button type="submit" id="btn-submit" class="postings-btn template-btn-submit">
          Submit application
        </button>
      </form>
    </div>
    <script src="../_shared/fixture.js"></script>
  </body>
</html>
