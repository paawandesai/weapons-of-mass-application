<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A required checkbox group</title>
  </head>
  <body>
    <form id="app">
      <fieldset>
        <legend>Languages<span aria-hidden="true">*</span></legend>
        <label><input type="checkbox" name="lang" value="en" checked /> English</label>
        <label><input type="checkbox" name="lang" value="fr" /> French</label>
      </fieldset>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
