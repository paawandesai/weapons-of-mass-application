<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that hydrates after it is visible</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Simulated hydration: the form is visible at once, then a framework replaces every element
      // (700 ms after load). Typing into the first copy is lost; only the second copy is live.
      function render() {
        document.getElementById('root').innerHTML =
          '<form id="app">' +
          '<div class="entry"><label for="name">Full name<span aria-hidden="true">*</span></label>' +
          '<input id="name" type="text" /></div>' +
          '<div class="entry"><label for="email">Email</label><input id="email" type="text" /></div>' +
          '<button type="submit">Submit application</button></form>';
        document.getElementById('app').addEventListener('submit', function (e) {
          e.preventDefault();
        });
      }
      window.rehydrate = render;
      render();
      setTimeout(render, 700);
    </script>
  </body>
</html>
