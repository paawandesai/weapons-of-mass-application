<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Invisible reCAPTCHA badge only</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <button type="submit">Submit application</button>
    </form>
    <div class="grecaptcha-badge" style="visibility: hidden; width: 256px; height: 60px">
      <iframe src="about:blank#recaptcha-anchor" title="reCAPTCHA" width="256" height="60"></iframe>
    </div>
  </body>
</html>
