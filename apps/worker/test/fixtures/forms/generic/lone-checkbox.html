<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lone checkboxes</title>
  </head>
  <body>
    <form id="app">
      <fieldset>
        <legend>Arbitration Agreement Acknowledgement<span aria-hidden="true">*</span></legend>
        <input type="checkbox" id="ack" name="ack" required />
        <label for="ack"
          >I acknowledge that I have read and understood the Arbitration Agreement.</label
        >
      </fieldset>
      <label><input type="checkbox" id="news" name="news" /> Keep me posted</label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
