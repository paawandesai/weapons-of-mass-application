<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>An answer reveals another required question</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <div class="entry" id="more" hidden>
        <label for="why">Why this role?<span aria-hidden="true">*</span></label>
        <input id="why" type="text" />
      </div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      document.getElementById('name').addEventListener('input', function () {
        document.getElementById('more').hidden = false;
      });
    </script>
  </body>
</html>
