<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Date without a format hint</title>
  </head>
  <body>
    <form id="app">
      <div class="entry">
        <label for="start">Earliest start</label>
        <input
          id="start"
          type="text"
          class="date-input"
          placeholder="Pick date..."
          autocomplete="off"
        />
        <div class="picker" id="picker" hidden>Pick a day</div>
      </div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      var input = document.getElementById('start');
      var picker = document.getElementById('picker');
      input.addEventListener('focus', function () {
        picker.hidden = false;
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') picker.hidden = true;
      });
      document.getElementById('app').addEventListener('submit', function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
