<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A self-identification section known only by its id</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <section id="eeoc_fields">
        <h3>A few questions about you</h3>
        <div class="entry">
          <label for="pro">Preferred pronouns</label><input id="pro" type="text" />
        </div>
      </section>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
