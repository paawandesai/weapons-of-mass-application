<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>An error message with a camel-case class and no ARIA</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      document.getElementById('app').addEventListener('submit', function (e) {
        e.preventDefault();
        var p = document.createElement('p');
        p.className = 'fieldError';
        p.textContent = 'That name is not accepted';
        document.getElementById('app').appendChild(p);
      });
    </script>
  </body>
</html>
