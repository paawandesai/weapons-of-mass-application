<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden file input with a drop zone</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <div role="group" aria-labelledby="cv-label" class="upload">
        <div id="cv-label">Resume/CV</div>
        <div class="dropzone" style="border: 1px dashed #999; padding: 20px">
          Drop your resume here
          <button type="button">Attach</button>
          <input id="cv" type="file" style="display: none" />
        </div>
        <span id="picked"></span>
      </div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      document.getElementById('cv').addEventListener('change', function (e) {
        document.getElementById('picked').textContent = e.target.files[0]
          ? e.target.files[0].name
          : '';
      });
      document.getElementById('app').addEventListener('submit', function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
