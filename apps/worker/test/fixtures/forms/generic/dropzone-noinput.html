<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drop zone without a file input</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <div class="dropzone" style="border: 1px dashed #999; padding: 20px">
        Drag and drop your resume here
      </div>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
