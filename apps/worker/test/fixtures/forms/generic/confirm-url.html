<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirmation by URL</title>
  </head>
  <body>
    <form id="app">
      <div class="entry"><label for="name">Full name</label><input id="name" type="text" /></div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      document.getElementById('app').addEventListener('submit', function (e) {
        e.preventDefault();
        location.href = 'confirm-url-done.html';
      });
    </script>
  </body>
</html>
